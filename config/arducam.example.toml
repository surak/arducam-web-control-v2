# Copy to ../arducam.toml (next to the project) or ~/.config/arducam-ptz/config.toml
# and edit. Every value below is the built-in default, so a shorter file that only
# sets what you care about works fine.
#
# Precedence: environment  >  this file  >  built-in defaults.
# Environment variables are ARDUCAM_<SECTION>__<KEY>, e.g.
#     ARDUCAM_PAN_TILT__PAN_MIN=70 ARDUCAM_SERVER__PORT=9000 uv run arducam-server
#
# Check what the running server actually believes:
#     curl -s localhost:8080/api/v1/health | python3 -m json.tool

# Force every hardware backend into simulation (no camera, no I2C at all).
# Handy for working on the web UI on a laptop.
simulate = false

[server]
host = "0.0.0.0"
port = 8080
log_level = "info"          # debug | info | warning | error

[camera]
simulate = false
# Preview stream size and JPEG quality. Measured cost on the Pi 5 at 27 fps:
#   640x480   q75 -> ~0.2 MB/s, 11% of one core
#   960x540   q75 -> ~0.3 MB/s, 13% of one core   <- default
#   1280x720  q70 -> ~0.5 MB/s, 16% of one core
preview_width = 960
preview_height = 540
preview_quality = 75
buffer_count = 4
# 0 x 0 = capture in the sensor's native mode (4656x3496 = 16 MP here).
# A non-zero size is generated by libcamera from a suitable sensor mode.
capture_width = 0
capture_height = 0
# Restart the preview if no frame arrives for this long (0 disables).
stall_timeout_s = 6.0
max_restarts = 5

[pan_tilt]
simulate = false
i2c_bus = 1
i2c_address = 64             # 0x40 - TOML has no hex literals
pan_channel = 1
tilt_channel = 0
min_pulse_us = 500
max_pulse_us = 2500
pwm_frequency_hz = 50.0
# Mechanical travel limits of this platform. Keep them: the camera hits the
# bracket outside this window.
pan_min = 60.0
pan_max = 120.0
tilt_min = 15.0
tilt_max = 145.0
pan_center = 90.0
tilt_center = 90.0
invert_pan = false
invert_tilt = false
# 0 = the slider goes exactly where you put it. Set e.g. 20 to make any single
# requested move at most 20 degrees (the response then reports the clamp).
max_step_degrees = 0.0
write_rate_hz = 20.0
min_write_interval_ms = 40.0

[focus]
simulate = false
# device = "/dev/v4l-subdev3"  # default: probe /dev/v4l-subdev* automatically
control = "focus_absolute"
settle_ms = 140
sample_timeout_ms = 1500
coarse_steps = 9
fine_steps = 9
near_is_high = true

[storage]
photos_dir = "photos"        # relative paths resolve against this file's folder
thumbnail_dir = ".thumbs"
thumbnail_max_dim = 320
filename_template = "photo_%Y%m%d-%H%M%S"
